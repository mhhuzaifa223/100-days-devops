services:
  web:
    build: ./app
    container_name: project-32-web
    ports:
      - "8086:5000"
    environment:
      DB_HOST: db
      POSTGRES_DB: devops
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops123
      REDIS_HOST: redis
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: project-32-db
    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops123
    volumes:
      - project-32-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: project-32-redis

volumes:
  project-32-db-data:
