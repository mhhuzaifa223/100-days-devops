name: Multi-Environment CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  development:
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      APP_VERSION: 1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Development Environment
        run: bash Day-03-CI-CD/Project-24/app.sh

  staging:
    needs: development
    runs-on: ubuntu-latest

    env:
      APP_ENV: staging
      APP_VERSION: 1.0.0-rc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Staging Environment
        run: bash Day-03-CI-CD/Project-24/app.sh

  production:
    needs: staging
    runs-on: ubuntu-latest

    env:
      APP_ENV: production
      APP_VERSION: 1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Production Environment
        run: bash Day-03-CI-CD/Project-24/app.sh
