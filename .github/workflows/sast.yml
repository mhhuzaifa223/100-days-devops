name: Python SAST

on:
  push:
    paths:
      - 'Day-09-DevSecOps/Project-86/**'
      - '.github/workflows/sast.yml'
  pull_request:
    paths:
      - 'Day-09-DevSecOps/Project-86/**'
      - '.github/workflows/sast.yml'
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day-09-DevSecOps/Project-86
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit SAST
        run: bandit -r app.py -f txt
