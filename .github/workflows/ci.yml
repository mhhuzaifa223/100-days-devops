name: Basic CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n Day-03-CI-CD/Project-21/app.sh
    
      - name: Run Application
        run: bash -n Day-03-CI-CD/Project-21/app.sh
