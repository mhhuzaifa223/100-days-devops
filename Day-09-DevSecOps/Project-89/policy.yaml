apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-safe-containers
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            containers:
              - securityContext:
                  privileged: "!true"
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container images must not use the latest tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
