apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-44-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-44-app
  template:
    metadata:
      labels:
        app: project-44-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 200m
          ports:
            - containerPort: 80
