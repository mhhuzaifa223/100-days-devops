<!DOCTYPE html>
<html>
<head>
    <title>Project 41 - Kubernetes</title>
</head>
<body>
    <h1>Kubernetes Three-Tier Application</h1>
    <p>Frontend: Nginx</p>
    <p>Backend: Flask</p>
    <p>Database: PostgreSQL</p>

    <h2>Backend Health</h2>
    <pre id="health">Checking...</pre>

    <h2>Database Connection</h2>
    <pre id="database">Checking...</pre>

    <script>
        fetch("/api/health")
            .then(response => response.json())
            .then(data => {
                document.getElementById("health").textContent =
                    JSON.stringify(data, null, 2);
            });

        fetch("/api/db")
            .then(response => response.json())
            .then(data => {
                document.getElementById("database").textContent =
                    JSON.stringify(data, null, 2);
            });
    </script>
</body>
</html>
