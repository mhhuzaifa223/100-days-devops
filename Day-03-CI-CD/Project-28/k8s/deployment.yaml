apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-28
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-28
  template:
    metadata:
      labels:
        app: project-28
    spec:
      containers:
        - name: project-28
          image: devops-project-28:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
