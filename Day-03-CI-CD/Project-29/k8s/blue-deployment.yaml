apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-29-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-29
      version: blue
  template:
    metadata:
      labels:
        app: project-29
        version: blue
    spec:
      containers:
        - name: project-29
          image: project-29-blue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
