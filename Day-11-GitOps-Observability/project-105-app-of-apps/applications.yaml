apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mhhuzaifa223/100-days-devops.git
    targetRevision: main
    path: Day-11-GitOps-Observability/project-103-helm-argocd
    helm:
      releaseName: nginx-dev
      valueFiles:
        - environments/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
